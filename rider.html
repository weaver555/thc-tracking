<!DOCTYPE html>
<html>
<head>
    <title>Rider Console - THC Delivery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #1a73e8; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #dadce0; border-radius: 6px; font-size: 16px; }
        button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        #status { padding: 10px; border-radius: 6px; margin-top: 15px; font-weight: bold; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .hidden { display: none; }
        .back-btn { background: #6c757d; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
        .order-list { max-height: 400px; overflow-y: auto; }
        .order-item { background: #f9f9f9; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid #1a73e8; }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="goHome()">← Back</button>

        <div class="card" id="loginSection">
            <h2>🚴‍♂️ Rider Console - Sign In</h2>
            <input type="email" id="riderEmail" placeholder="Rider Email">
            <input type="password" id="riderPassword" placeholder="Password">
            <button class="btn-primary" onclick="riderLogin()">Sign In</button>
            <div id="status"></div>
        </div>

        <div class="card hidden" id="riderDashboard">
            <h2>Welcome, <span id="riderName"></span>! 🎉</h2>
            
            <h3>📋 Available Orders</h3>
            <div class="order-list" id="orderList">Loading...</div>
            
            <h3 style="margin-top: 20px;">Current Delivery</h3>
            <select id="currentOrder">
                <option value="">Select an order to deliver</option>
            </select>
            <button class="btn-success" onclick="acceptOrder()">✓ Accept Order</button>
            
            <div id="deliverySection" class="hidden" style="margin-top: 20px; padding-top: 20px; border-top: 2px solid #ddd;">
                <h3>🚴 Active Delivery</h3>
                <div id="orderDetails"></div>
                <button class="btn-success" onclick="startTracking()" id="startBtn">🚴 Start Delivery & Track</button>
                <button class="btn-danger" onclick="completeDelivery()" id="completeBtn" class="hidden">✅ Mark as Delivered</button>
                <button class="btn-danger" onclick="riderLogout()" style="margin-top: 20px;">Sign Out</button>
            </div>
            
            <div id="status"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC57agn1E9fiWBY1Zls4HggsKwKsQAwBoQ",
            authDomain: "thc-rider-tracker.firebaseapp.com",
            databaseURL: "https://thc-rider-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "thc-rider-tracker",
            storageBucket: "thc-rider-tracker.appspot.com",
            messagingSenderId: "1020694020459",
            appId: "1:1020694020459:web:3abf81418fec72af168c2e"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentRiderId = null;
        let watchId = null;
        let activeOrderId = null;

        function goHome() { window.location.href = 'index.html'; }

        function updateStatus(msg, type = 'info') {
            const el = document.getElementById('status');
            el.innerText = msg;
            el.className = type;
        }

        function riderLogin() {
            const email = document.getElementById('riderEmail').value.trim();
            const password = document.getElementById('riderPassword').value;
            
            if (!email || !password) {
                updateStatus('❌ Enter email and password', 'error');
                return;
            }

            auth.signInWithEmailAndPassword(email, password).then((user) => {
                currentRiderId = user.user.uid;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('riderDashboard').classList.remove('hidden');
                document.getElementById('riderName').innerText = email.split('@')[0];
                loadAvailableOrders();
            }).catch(err => {
                updateStatus('❌ Login failed: ' + err.message, 'error');
            });
        }

        function loadAvailableOrders() {
            database.ref('orders').on('value', (snapshot) => {
                let pendingOrders = [];
                let html = '';
                let selectHtml = '<option value="">Select an order</option>';
                
                snapshot.forEach((child) => {
                    const order = child.val();
                    if (order.status === 'PENDING' || order.status === 'ACCEPTED') {
                        pendingOrders.push(order);
                        html += `<div class="order-item">
                            <strong>${order.orderId}</strong><br>
                            👤 ${order.customerName} | ☎️ ${order.customerPhone}<br>
                            📍 ${order.landmark}<br>
                            🍕 ${order.items.substring(0, 50)}...<br>
                            💰 ₱${order.amount}<br>
                            Status: <strong>${order.status}</strong>
                        </div>`;
                        selectHtml += `<option value="${order.orderId}">${order.orderId} - ${order.customerName}</option>`;
                    }
                });
                
                document.getElementById('orderList').innerHTML = html || 'No pending orders';
                document.getElementById('currentOrder').innerHTML = selectHtml;
            });
        }

        function acceptOrder() {
            const orderId = document.getElementById('currentOrder').value;
            if (!orderId) {
                updateStatus('❌ Select an order', 'error');
                return;
            }

            activeOrderId = orderId;
            database.ref('orders/' + orderId).update({ status: 'ACCEPTED' }).then(() => {
                updateStatus('✓ Order accepted! Now start delivery.', 'success');
                loadOrderDetails();
            }).catch(err => {
                updateStatus('❌ Error: ' + err.message, 'error');
            });
        }

        function loadOrderDetails() {
            database.ref('orders/' + activeOrderId).once('value', (snapshot) => {
                const order = snapshot.val();
                document.getElementById('deliverySection').classList.remove('hidden');
                document.getElementById('orderDetails').innerHTML = `
                    <strong>Order ID:</strong> ${order.orderId}<br>
                    <strong>Customer:</strong> ${order.customerName}<br>
                    <strong>Phone:</strong> ${order.customerPhone}<br>
                    <strong>Address:</strong> ${order.landmark}<br>
                    <strong>Items:</strong> ${order.items}<br>
                    <strong>Amount:</strong> ₱${order.amount}<br>
                    <strong>Location:</strong> Lat: ${order.latitude}, Lng: ${order.longitude}
                `;
            });
        }

        function startTracking() {
            if (!navigator.geolocation) {
                updateStatus('❌ GPS not available', 'error');
                return;
            }

            updateStatus('📍 Starting delivery with GPS tracking...', 'info');
            document.getElementById('startBtn').disabled = true;
            document.getElementById('completeBtn').classList.remove('hidden');

            // Update order status to ON_THE_WAY
            database.ref('orders/' + activeOrderId).update({ status: 'ON_THE_WAY' });

            watchId = navigator.geolocation.watchPosition((position) => {
                const riderData = {
                    riderId: currentRiderId,
                    orderId: activeOrderId,
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude,
                    status: 'On the Way',
                    updatedAt: Date.now()
                };

                database.ref('active_riders/' + currentRiderId).set(riderData);
                updateStatus(`📍 Live tracking active: ${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}`, 'success');
            }, (error) => {
                updateStatus('❌ GPS Error: ' + error.message, 'error');
            }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
        }

        function completeDelivery() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            
            database.ref('orders/' + activeOrderId).update({ status: 'DELIVERED' });
            database.ref('active_riders/' + currentRiderId).remove();
            
            updateStatus('✅ Order delivered!', 'success');
            activeOrderId = null;
            document.getElementById('deliverySection').classList.add('hidden');
            document.getElementById('startBtn').disabled = false;
            document.getElementById('completeBtn').classList.add('hidden');
            loadAvailableOrders();
        }

        function riderLogout() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            auth.signOut().then(() => {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('riderDashboard').classList.add('hidden');
                document.getElementById('riderEmail').value = '';
                document.getElementById('riderPassword').value = '';
                updateStatus('');
            });
        }
    </script>
</body>
</html>
