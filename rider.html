<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAASIN'S OG BURGER PROJECT</title><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><style>body{margin:0;background:#f5f5f2;color:#20231f;font:16px Arial}.wrap{max-width:680px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #e1e4dd;border-radius:14px;padding:20px;margin:14px 0}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px}input,button{font:inherit;padding:12px;border-radius:9px;box-sizing:border-box}input{width:100%;border:1px solid #bfc5bb;margin:7px 0}button{background:#253c28;color:#fff;border:0;font-weight:700;cursor:pointer}.danger{background:#8b3030}.hidden{display:none}.note{padding:10px;background:#f3f5ee;border-radius:9px}.error{background:#fdeced;color:#8a2428}.messages{height:230px;overflow:auto;border:1px solid #e1e4dd;border-radius:9px;padding:10px}.msg{background:#edf2e8;padding:8px;margin:6px 0;border-radius:8px}.mine{margin-left:auto;background:#dcebd8}.row{display:flex;gap:8px}.row input{margin:0}.sub{color:#62685f;font-size:14px}</style></head><body><main class="wrap"><h1>MAASIN'S OG BURGER PROJECT</h1><p class="sub">Rider delivery console</p><section id="login" class="card"><h2>Rider sign in</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Sign in</button><p id="logNote" class="note hidden"></p></section><section id="dash" class="hidden"><div class="card"><h2>Confirm order</h2><input id="oid" placeholder="Order number"><input id="cname" placeholder="Customer full name with surname"><button onclick="confirmOrder()">Confirm and start delivery</button><p id="note" class="note hidden"></p></div><section id="active" class="hidden"><div class="card"><h2 id="title">Active delivery</h2><p id="customerLoc" class="sub">Customer location not shared yet.</p><button onclick="startGps()">Start rider location sharing</button><button class="danger" onclick="complete()">Mark delivered and end chat</button></div><div class="card"><h2>Customer messages</h2><div id="messages" class="messages"></div><div class="row" style="margin-top:10px"><input id="text" placeholder="Write a message"><button onclick="send()">Send</button></div></div></section></section></main><script>const cfg={apiKey:"AIzaSyC57agn1E9fiWBY1Zls4HggsKwKsQAwBoQ",authDomain:"thc-rider-tracker.firebaseapp.com",databaseURL:"https://thc-rider-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"thc-rider-tracker",storageBucket:"thc-rider-tracker.appspot.com",messagingSenderId:"1020694020459",appId:"1:1020694020459:web:3abf81418fec72af168c2e"};firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.database();let rider,key,watch;function say(t,b=false){let e=document.getElementById('note');e.textContent=t;e.className='note '+(b?'error':'');e.classList.remove('hidden')}function login(){auth.signInWithEmailAndPassword(email.value.trim(),pass.value).then(u=>{rider=u.user.uid;document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden')}).catch(e=>{logNote.textContent=e.message;logNote.classList.remove('hidden')})}function confirmOrder(){let id=oid.value.trim(),n=cname.value.trim().toUpperCase();if(!id||!n)return say('Enter the order number and full customer name.',true);db.ref('orders').once('value').then(s=>{let f; s.forEach(c=>{let o=c.val();if(!f&&o.orderId===id&&o.customerName&&o.customerName.trim().toUpperCase()===n)f={key:c.key,o}});if(!f)throw Error('No exact order-slip match found.');key=f.key;return db.ref('orders/'+key).update({status:'ON_THE_WAY',riderId:rider,confirmedAt:Date.now()}).then(()=>db.ref('delivery_rooms/'+key).update({orderKey:key,orderId:id,customerName:f.o.customerName,status:'ON_THE_WAY',riderId:rider,confirmedAt:Date.now()}))}).then(()=>{active.classList.remove('hidden');title.textContent='Active delivery: '+id;listen();say('Order confirmed. The customer can now join the delivery room.')}).catch(e=>say(e.message,true))}function listen(){db.ref('delivery_rooms/'+key).on('value',s=>{let r=s.val();if(!r)return;if(r.customerLocation)customerLoc.textContent='Customer location: '+r.customerLocation.lat.toFixed(5)+', '+r.customerLocation.lng.toFixed(5);let ms=r.messages||{};messages.innerHTML=Object.values(ms).sort((a,b)=>a.at-b.at).map(m=>'<div class="msg '+(m.from==='rider'?'mine':'')+'"><small>'+ (m.from==='rider'?'You':'Customer')+'</small><br>'+String(m.text).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div>').join('');messages.scrollTop=messages.scrollHeight})}function send(){let t=text.value.trim();if(t&&key){db.ref('delivery_rooms/'+key+'/messages').push({from:'rider',text:t,at:Date.now()});text.value=''}}function startGps(){if(!navigator.geolocation)return say('GPS is unavailable.',true);if(watch)navigator.geolocation.clearWatch(watch);watch=navigator.geolocation.watchPosition(p=>db.ref('delivery_rooms/'+key+'/riderLocation').set({lat:p.coords.latitude,lng:p.coords.longitude,at:Date.now()}),e=>say(e.message,true),{enableHighAccuracy:true,timeout:10000})}function complete(){if(!key)return;if(watch)navigator.geolocation.clearWatch(watch);db.ref('orders/'+key).update({status:'DELIVERED',deliveredAt:Date.now()}).then(()=>db.ref('delivery_rooms/'+key).remove()).then(()=>{active.classList.add('hidden');say('Delivered. The customer room and messages have been removed.');key=null}).catch(e=>say(e.message,true))}</script></body></html>
