<!DOCTYPE html>
<html>
<head>
    <title>Rider Secure Console</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!-- 1. Add correct Firebase v8 SDK scripts in your <head> -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; background: #f4f6f9; color: #333; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 380px; margin: 40px auto; }
        h2 { margin-bottom: 20px; color: #1a73e8; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #dadce0; box-sizing: border-box; font-size: 16px; }
        button { background: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; }
        #status { color: #28a745; font-weight: bold; margin-top: 15px; display: block; background: #e6f4ea; padding: 10px; border-radius: 6px; }
        .error-msg { color: #d93025 !important; background: #fce8e6 !important; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Rider Console</h2>
        <div id="login-section">
            <input type="email" id="riderEmailInput" placeholder="Rider Email">
            <input type="password" id="riderPasswordInput" placeholder="Password">
            <button type="button" onclick="executeSecureLogin()">Sign In to Shift</button>
        </div>
        <div id="tracking-section" class="hidden">
            <p>Welcome, <span id="rider-email-display" style="font-weight:bold;"></span></p>
            <input type="text" id="orderId" placeholder="Enter Loyverse Order ID">
            <button type="button" onclick="startTracking()" style="background: #28a745;">Go Active & Start Tracking</button>
            <button type="button" onclick="logoutRider()" style="background: #dc3545; margin-top: 20px;">Sign Out</button>
        </div>
        <div id="status">Status: Ready to connect...</div>
    </div>
    <script>
               const firebaseConfig = {
    apiKey: "AIzaSyC57agn1E9fiWBY1Zls4HggsKwKsQAwBoQ",
    authDomain: "thc-rider-tracker.firebaseapp.com",
    databaseURL: "https://thc-rider-tracker-default-rtdb.asia-southeast1.firebasedatabase.app", 
    projectId: "thc-rider-tracker",
    storageBucket: "thc-rider-tracker.appspot.com",
    messagingSenderId: "1020694020459",
    appId: "1:1020694020459:web:3abf81418fec72af168c2e"
};


        
        // Helper function to reset status styles smoothly
        function updateStatus(text, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = text;
            if (isError) {
                statusDiv.classList.add('error-msg');
            } else {
                statusDiv.classList.remove('error-msg');
            }
        }
        
        try { 
            firebase.initializeApp(firebaseConfig); 
            updateStatus("System Diagnostic: Connected."); 
        } 
        catch (err) { 
            updateStatus("Setup Error: " + err.message, true); 
        }

        const auth = firebase.auth();
        const database = firebase.database();
        let watchId = null;
        let currentRiderId = null;

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentRiderId = user.uid;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('tracking-section').classList.remove('hidden');
                document.getElementById('rider-email-display').innerText = user.email;
                updateStatus("Active Shift Session Loaded.");
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('tracking-section').classList.add('hidden');
                updateStatus("Logged out. Ready.");
            }
        });

        function executeSecureLogin() {
            const email = document.getElementById('riderEmailInput').value.trim();
            const password = document.getElementById('riderPasswordInput').value;
            if(!email || !password) { alert("Please type email and password."); return; }
            updateStatus("Authenticating...");
            auth.signInWithEmailAndPassword(email, password).catch(err => {
                updateStatus("Error: Login Denied.", true);
                alert("Firebase Rejection: " + err.message);
            });
        }

        function logoutRider() { 
            if (watchId) navigator.geolocation.clearWatch(watchId); 
            auth.signOut(); 
        }

        function startTracking() {
            const orderId = document.getElementById('orderId').value.trim();
            if (!orderId) { alert('Please enter a Loyverse Order ID.'); return; }
            if (navigator.geolocation) {
                updateStatus("Verifying GPS...");
                watchId = navigator.geolocation.watchPosition((position) => {
                    database.ref('active_riders/' + currentRiderId).set({
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        orderId: orderId,
                        status: "Out for Delivery",
                        updatedAt: Date.now()
                    }).then(() => { 
                        updateStatus(`Tracking active for Order #${orderId}!`); 
                    });
                }, (error) => { 
                    alert("Please turn on phone location services."); 
                }, { enableHighAccuracy: true, maximumAge: 0 });
            }
        }
    </script>
</body>
</html>
